[project]
name = "dssxz-backend"
version = "0.1.0"
description = "DocFlow 后端服务"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.0",
    "gunicorn==22.0.0",
    "sqlalchemy[asyncio]==2.0.30",
    "aiosqlite==0.20.0",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "redis[asyncio]==5.0.4",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "pydantic-settings==2.3.1",
    "slowapi==0.1.9",
    "loguru==0.7.2",
    "httpx==0.27.0",
    "python-multipart==0.0.9",
    "alibabacloud-dysmsapi20170525>=4.0.0",
    "wechatpayv3[async]>=2.0.2",
    "weasyprint>=60.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "integration: 集成测试（需要真实数据库/API）",
    "slow: 慢速测试",
    "pandoc: 需要 pandoc 可用",
    "unit: 单元测试",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    'if __name__ == ".__main__.":',
]
exclude_dirs = ["tests", "migrations", "scripts"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
